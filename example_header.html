// --- Icon helpers using lucide ---------------------------------------------
const Icon = ({ name, size = 20, className = "", strokeWidth = 1.75 }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const icons = window.lucide && window.lucide.icons;
    if (!icons) return;
    const toPascal = (s) => s.split('-').map(p => p[0].toUpperCase() + p.slice(1)).join('');
    const def = icons[toPascal(name)] || icons[name];
    if (!def) return;
    // def is [tag, attrs, children]
    ref.current.innerHTML = '';
    const svg = window.lucide.createElement ? window.lucide.createElement(def) : null;
    if (svg) {
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.setAttribute('stroke-width', strokeWidth);
      ref.current.appendChild(svg);
    }
  }, [name, size, strokeWidth]);
  return <span ref={ref} className={"inline-flex items-center justify-center " + className} style={{ width: size, height: size }} />;
};

const HeroVideo = () => {
  const ref = useRef(null);
  useEffect(() => {
    const v = ref.current;
    if (!v) return;
    let raf;
    const animateOpacity = (from, to, dur = 500) => {
      cancelAnimationFrame(raf);
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / dur);
        v.style.opacity = String(from + (to - from) * t);
        if (t < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    };
    const onCanPlay = () => { v.play().catch(() => {}); animateOpacity(0, 1); };
    const onTimeUpdate = () => {
      if (v.duration && v.duration - v.currentTime <= 0.55) {
        const cur = parseFloat(v.style.opacity || '1');
        if (cur > 0.95) animateOpacity(cur, 0);
      }
    };
    const onEnded = () => {
      v.style.opacity = '0';
      setTimeout(() => { v.currentTime = 0; v.play().catch(() => {}); animateOpacity(0, 1); }, 100);
    };
    v.addEventListener('canplay', onCanPlay);
    v.addEventListener('timeupdate', onTimeUpdate);
    v.addEventListener('ended', onEnded);
    return () => {
      cancelAnimationFrame(raf);
      v.removeEventListener('canplay', onCanPlay);
      v.removeEventListener('timeupdate', onTimeUpdate);
      v.removeEventListener('ended', onEnded);
    };
  }, []);
  return (
    <video
      ref={ref}
      className="absolute inset-0 w-full h-full object-cover object-bottom"
      style={{ opacity: 0 }}
      muted
      autoPlay
      playsInline
      preload="auto"

    />
  );
};

// --- About -----------------------------------------------------------------
const AboutSection = () => {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } });
    }, { rootMargin: '-100px' });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  const base = { transition: 'opacity 0.8s ease, transform 0.8s ease' };
  return (
    <section
      ref={ref}
      className="bg-black pt-32 md:pt-44 pb-10 md:pb-14 px-6 overflow-hidden relative"

// --- Reveal (IntersectionObserver + CSS) -----------------------------------
const useReveal = (margin = '-100px') => {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } });
    }, { rootMargin: margin });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, [margin]);
  return [ref, inView];
};

const revealStyle = (inView, { y = 0, x = 0, duration = 0.8, delay = 0 } = {}) => ({
  opacity: inView ? 1 : 0,
  transform: inView ? 'translate3d(0,0,0)' : `translate3d(${x}px, ${y}px, 0)`,
  transition: `opacity ${duration}s ease ${delay}s, transform ${duration}s ease ${delay}s`,
  willChange: 'opacity, transform',
});
