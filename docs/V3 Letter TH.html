  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ne-height:1.8; font-size:16px }\n  *{ box-sizing:border-box }\n  p{ margin:0 0 14px }\n\n  .page{ max-width:640px; margin:40px auto; background:var(--paper); padding:50px 60px; box-shadow:0 4px 30px rgba(0,0,0,.1) }\n\n  .head{ font-family:var(--font-head); font-weight:700; line-height:1.3 }\n  .label{ font-family:var(--font-head); font-size:12px; letter-spacing:2px; font-weight:600; color:var(--muted) }\n  .accent{ background:var(--accent); padding:2px 6px }\n  .small{ font-size:14px }\n\n  /* letterhead */\n  .letterhead{ border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:26px; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px }\n  .letterhead .brand{ font-family:var(--font-head); font-size:18px; font-weight:700 }\n\n  /* VSL */\n  .vsl{ background:#0a0a0a; height:280px; border:1.5px dashed #555; display:flex; align-items:center; justify-content:center; position:relative; margin:24px 0 }\n  .vsl .play{ width:60px; height:60px; border-radius:30px; border:3px solid #fff; display:flex; align-items:center; justify-content:center }\n  .vsl .play::after{ content:''; width:0; height:0; border-left:18px solid #fff; border-top:11px solid transparent; border-bottom:11px solid transparent; margin-left:5px }\n  .vsl .meta{ position:absolute; top:12px; left:14px; font-family:var(--font-head); font-size:12px; color:#fff; opacity:.6; letter-spacing:1px }\n\n  /* button */\n  .btn{ display:block; width:100%; text-align:center; background:var(--accent); border:2px solid var(--ink); padding:20px 20px; font-family:var(--font-head); font-weight:700; font-size:20px; box-shadow:5px 5px 0 var(--ink); cursor:pointer; color:var(--ink); text-decoration:none; margin:10px 0; line-height:1.3 }\n  .btn:hover{ transform:translate(2px,2px); box-shadow:3px 3px 0 var(--ink) }\n\n  .hard-truth{ background:var(--ink); color:#f5f3ed; padding:28px; margin:28px 0 }\n  .hard-truth .label{ color:var(--accent) }\n  .hard-truth h2{ color:#f5f3ed; font-size:24px; margin:10px 0; font-family:var(--font-head); font-weight:700; line-height:1.4 }\n  .hard-truth p{ color:#bbb6a8; margin:0 }\n\n  .pullquote{ border-left:4px solid var(--ink); padding:16px 0 16px 22px; margin:16px 0; background:rgba(0,0,0,.02); font-weight:500 }\n\n  .bonus-card{ background:#fff; border:2px solid var(--ink); box-shadow:5px 5px 0 var(--ink); padding:26px; margin:28px 0; transform:rotate(-.4deg) }\n  .bonus-card h3{ font-size:22px; margin:0 0 16px; font-family:var(--font-head); font-weight:700 }\n  .bonus-card ul{ list-style:none; padding:0; margin:0 }\n  .bonus-card li{ padding:12px 0; border-bottom:1px dashed #ccc }\n  .bonus-card li:last-child{ border:none }\n\n  /* ORDER FORM */\n  .order{ background:#fff; border:2px solid var(--ink); box-shadow:6px 6px 0 var(--ink); margin:32px 0 }\n  .order .step-head{ background:var(--ink); color:#f5f3ed; padding:16px 20px; display:flex; align-items:center; gap:12px; font-family:var(--font-head); font-size:18px; font-weight:600 }\n  .order .step-head .num{ width:30px; height:30px; border-radius:15px; background:var(--accent); color:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:700 }\n  .order .step-head .secure{ margin-left:auto; font-size:12px; color:var(--accent); letter-spacing:1.5px; font-weight:500 }\n  .order .fields{ padding:20px; display:flex; flex-direction:column; gap:14px }\n  .order .field label{ display:block; font-family:var(--font-head); font-size:12px; letter-spacing:1px; color:var(--muted); margin-bottom:6px; font-weight:500 }\n  .order .field input{ width:100%; border:2px solid var(--ink); padding:13px 14px; font-family:var(--font-body); font-size:15px; background:#fff }\n  .order .field input:focus{ outline:none; background:#fffde7 }\n  .order .row{ display:flex; gap:12px }\n  .order .row .field{ flex:1 }\n\n  .bump{ border:2px dashed var(--ink); padding:18px; margin:12px 0; background:rgba(0,0,0,.02); position:relative }\n  .bump.featured{ ture{ font-family:var(--font-sig); font-style:italic; font-size:28px; font-weight:600; margin-top:4px; color:var(--ink) }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<div class=\"page\">\n\n  <div class=\"letterhead\">\n    <div class=\"brand\">— จดหมายเปิดผนึก —<\u002Fdiv>\n    <div class=\"label\">กรุงเทพฯ · เมษายน 2569<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"label\" style=\"text-align:center; display:block; margin-bottom:14px\">\n    จากโต๊ะทำงานของผู้ก่อตั้งบริษัท ฿100 ล้าน\n  <\u002Fdiv>\n\n  <!-- HEADLINE -->\n  <h1 class=\"head\" style=\"font-size:36px; text-align:center; margin:0 0 14px; line-height:1.3; font-weight:700\">\n    \"ถ้าผมต้องสร้างบริษัทมูลค่า <span class=\"accent\">฿100 ล้าน<\u002Fspan><br>\n    จากศูนย์อีกครั้งในปี 2026…\"\n  <\u002Fh1>\n\n  <p style=\"text-align:center; font-size:18px; font-weight:500; opacity:.8; margin:0 0 16px\">\n    …นี่คือ<u>คู่มือเล่มเดียว<\u002Fu>ที่ผมจะใช้ และวันนี้ผมจะมอบให้คุณฟรี\n  <\u002Fp>\n\n  <div class=\"vsl\">\n    <div class=\"meta\">VSL · 00:00 / 27:14<\u002Fdiv>\n    <div class=\"play\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- LETTER BODY -->\n  <p class=\"head\" style=\"font-size:20px; margin:24px 0 14px; font-weight:600\">เรียน เพื่อนผู้ก่อตั้งทุกท่าน<\u002Fp>\n\n  <p>ผมขอเริ่มด้วยคำสารภาพ <span class=\"accent\">เมื่อสามปีก่อน ผมเกือบยอมแพ้<\u002Fspan>\n  ผมทุ่มเทไป 18 เดือน เงินเก็บหมดเกลี้ยง และเหลืออีกแค่เดือนเดียวก็ต้องปิดบริษัท<\u002Fp>\n\n  <p>แล้วผมก็ได้ค้นพบบางอย่าง ไม่ใช่ \"ทริค\" ไม่ใช่ \"เคล็ดลับ\" แต่คือ<strong>ระบบ<\u002Fstrong>\n  — วิธีการรวม AI กับกรอบความคิดด้าน product-market ที่เปลี่ยนทุกสิ่ง<\u002Fp>\n\n  <div class=\"pullquote\">\n    \"ภายใน 11 เดือน ผมทำรายได้ทะลุ ฿10 ล้าน ภายใน 30 เดือน นักลงทุนประเมินมูลค่าบริษัทที่\n    ฿127 ล้าน โดยที่ผมไม่ได้ระดมทุนเลย และผมก็ไม่จำเป็นต้องระดมด้วย\"\n  <\u002Fdiv>\n\n  <p>คุณอาจจะสงสัย <em>มันเป็นไปได้จริงๆ สำหรับผมด้วยเหรอ?<\u002Fem><\u002Fp>\n  <p>คำตอบสั้นๆ คือ <strong>ได้<\u002Fstrong> — แต่ไม่ใช่ถ้าคุณยังทำแบบเดิมๆ ที่คุณทำอยู่ตอนนี้<\u002Fp>\n\n  <!-- HARD TRUTH -->\n  <div class=\"hard-truth\">\n    <div class=\"label\">ความจริงที่เจ็บปวด<\u002Fdiv>\n    <h2>99.4% ของผู้ประกอบการไทยจะไม่มีวันข้าม ฿10 ล้าน<\u002Fh2>\n    <p>ไม่ใช่เพราะพวกเขาขี้เกียจ ไม่ใช่เพราะพวกเขาโง่ แต่เพราะพวกเขาไม่เคยถูกสอน<em>ระบบ<\u002Fem>\n    ที่คน 0.6% ข้างบนใช้กัน<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- BULLETS -->\n  <p>นี่คือสิ่งที่คุณจะได้ค้นพบใน <strong>AI ฿100M Blueprint<\u002Fstrong>:<\u002Fp>\n  <ul style=\"padding-left:22px; line-height:1.9; margin:0 0 20px\">\n    <li>\"Wedge Method\" — วิธีหาตลาดมูลค่าพันล้านที่ไม่มีใครเห็น…<\u002Fli>\n    <li>ลำดับ 7 prompts ที่ผมใช้ \"โคลน\" เซลล์มือหนึ่งของผมด้วย AI…<\u002Fli>\n    <li>ทำไม MRR ถึงเป็นกับดัก (และตัวเลขที่ผลักดัน valuation จริงๆ คืออะไร)…<\u002Fli>\n    <li>วิธีวางโครงสร้างบริษัทให้นักลงทุน<em>อ้อนวอน<\u002Fem>ขอลงทุนกับคุณ…<\u002Fli>\n    <li>\"Valuation Sprint\" 90 วัน ที่ผมรันทุกไตรมาส…<\u002Fli>\n  <\u002Ful>\n\n  <!-- BONUSES -->\n  <div class=\"bonus-card\">\n    <h3>+ 5 โบนัสมูลค่ารวม <span class=\"accent\">฿72,400<\u002Fspan><\u002Fh3>\n    <ul>\n      <li>① Pitch Deck ฿100 ล้าน (มูลค่า ฿9,900)<\u002Fli>\n      <li>② AI Prompt Vault — 300+ prompts (มูลค่า ฿6,500)<\u002Fli>\n      <li>③ Live Q&amp;A 12 สัปดาห์ (มูลค่า ฿19,000)<\u002Fli>\n      <li>④ Private Founder Circle — ชุมชนผู้ก่อตั้งส่วนตัว (มูลค่า ฿12,000)<\u002Fli>\n      <li>⑤ Strategy Call 1:1 กับผมโดยตรง (มูลค่า ฿25,000)<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <!-- SIGN OFF -->\n  <p>เอาตรงๆ นะครับ — ผมบังคับให้คุณกดปุ่มด้านล่างไม่ได้<\u002Fp>\n  <p>แต่ผม<em>บอกคุณได้<\u002Fem>ว่า ทุกๆ วันที่คุณรอ คือวันที่คู่แข่งของคุณกำลังพัฒนาด้วย AI\n  ในขณะที่คุณยัง \"คิดอยู่\"<\u002Fp>\n\n  <p style=\"margin-top:28px\">แล้วพบกันครับ,<\u002Fp>\n  <div class=\"signature\">~ Your Future Mentor<\u002Fdiv>\n  <div class=\"label\" style=\"margin-top:6px\">ผู้ก่อตั้ง · AI-100M BLUEPRINT<\u002Fdiv>\n\n\n  <!-- ORDER FORM -->\n  <div class=\"order\">\n    <div class=\"step-head\">\n      <div class=\"num\">1<\u
